# ============================================================================
# EXISTING ENTITIES (Intent lifecycle tracking)
# ============================================================================

type Intent @entity {
  id: ID! # intentId
  intentId: Bytes!
  queueIdx: BigInt!

  # Intent struct fields
  initiator: Bytes!
  receiver: Bytes!
  inputAsset: Bytes!
  outputAsset: Bytes!
  maxFee: Int!
  amountOutMin: BigInt! # Minimum amount out (V5 uses this, V1 sets to 0)
  origin: Int!
  nonce: BigInt!
  timestamp: BigInt!
  ttl: BigInt!
  originAmount: BigInt!
  destinations: [Int!]!
  data: Bytes!

  # Metadata
  chainId: Int!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  sender: Bytes! # The address that submitted the intent

  # Transaction metadata (for Cartographer checkpoint/pagination)
  txOrigin: Bytes
  txNonce: BigInt # Not available on RPC chains (TAC, Hub)
  gasPrice: BigInt # Not available on RPC chains
  gasLimit: BigInt # Not available via Envio field_selection

  # Fill metadata
  receiveBlockNumber: BigInt # Block number when filled (from Fill event)
  isFastPath: Boolean! # true if ttl != 0

  # Fee information (from FeeAdapter IntentWithFeesAdded event)
  tokenFee: BigInt # Token fee paid by initiator
  nativeFee: BigInt # Native token fee paid by initiator

  # Order information (from FeeAdapterV2 OrderCreated event)
  orderId: Bytes # The order ID if this intent was created as part of a batch order

  # Relations
  fills: [Fill!]! @derivedFrom(field: "intent")

  # Status tracking
  status: IntentStatus!
}

enum IntentStatus {
  ADDED
  DISPATCHED
  FILLED
  SETTLED
}

type Fill @entity {
  id: ID! # intentId-chainId-transactionHash
  intentId: Bytes!
  solver: Bytes!
  totalFeeDBPS: BigInt!
  queueIdx: BigInt!

  # Linked intent
  intent: Intent!

  # Intent data at fill time (for reference)
  initiator: Bytes!
  receiver: Bytes!
  inputAsset: Bytes!
  outputAsset: Bytes!
  maxFee: Int!
  origin: Int!
  nonce: BigInt!
  timestamp: BigInt!
  ttl: BigInt!
  originAmount: BigInt!
  fillAmount: BigInt! # Amount after deducting fee (originAmount - fee)
  destinations: [Int!]!
  data: Bytes!

  # Metadata
  chainId: Int!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!

  # Transaction metadata
  txOrigin: Bytes
  txNonce: BigInt # Not available on RPC chains (TAC, Hub)
  gasPrice: BigInt # Not available on RPC chains
  gasLimit: BigInt # Not available via Envio field_selection
}

type IntentStatistics @entity {
  id: ID! # "global"

  # Intent counts
  totalUniqueIntents: BigInt!      # All intents (nettable + fillable)
  totalNettableIntents: BigInt!    # Intents with ttl == 0
  totalFillableIntents: BigInt!    # Intents with ttl != 0

  # Fill counts (only valid fills where intent exists)
  totalFills: BigInt!
}

type Asset @entity {
  id: ID! # address-chainId
  address: Bytes!
  chainId: Int!

  # Volume tracking
  totalIntentVolume: BigInt!
  totalFillVolume: BigInt!

  # Count tracking
  intentCount: BigInt!
  fillCount: BigInt!
}

# ============================================================================
# SPOKE ENTITIES — Settlement lifecycle
# ============================================================================

enum SpokeIntentStatus {
  NONE
  ADDED
  DISPATCHED
  SETTLED
