# ============================================================================
# HUB ENTITIES — Intent lifecycle
# ============================================================================

enum HubIntentStatus {
  NONE
  ADDED
  DEPOSIT_PROCESSED
  FILLED
  ADDED_AND_FILLED
  INVOICED
  SETTLED
  SETTLED_AND_MANUALLY_EXECUTED
  UNSUPPORTED
  UNSUPPORTED_RETURNED
}

type HubIntent @entity {
  id: ID! # intentId
  status: HubIntentStatus!
  settlementId: String # reference to HubSettlement
  messageId: String # reference to SettlementMessage

  # IntentProcessed event data
  addEventTransactionHash: Bytes
  addEventTimestamp: BigInt
  addEventBlockNumber: BigInt
  addEventTxNonce: BigInt

  # FillProcessed event data
  fillEventTransactionHash: Bytes
  fillEventTimestamp: BigInt
  fillEventBlockNumber: BigInt
  fillEventTxNonce: BigInt
}

