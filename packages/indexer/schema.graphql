  # Settlement transaction
  settlementTransactionHash: Bytes!
  settlementTimestamp: BigInt!
  settlementBlockNumber: BigInt!
  settlementTxOrigin: Bytes
  settlementTxNonce: BigInt
  settlementGasPrice: BigInt
  settlementGasLimit: BigInt
}

type ExternalCalldataExecutedEvent @entity {
  id: ID! # intentId
  intentId: Bytes!
