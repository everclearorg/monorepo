name: everclear-indexer-prod
description: Indexes IntentAdded and IntentFilled events from EverclearSpoke contracts across all mainnet chains

# Configure which fields to include from events
field_selection:
  transaction_fields:
    - "hash"

# Define the contract ABIs
contracts:
  - name: EverclearSpoke
    abi_file_path: ./abis/EverclearSpoke.json
    handler: ./src/EventHandlers.ts
    events:
      - event: IntentAdded
      - event: IntentFilled
      - event: IntentQueueProcessed
  
  - name: EverclearSpokeV5
    abi_file_path: ./abis/EverclearSpokeV5.json
    handler: ./src/EventHandlers.ts
    events:
      - event: IntentAdded
      - event: IntentFilled
      - event: IntentQueueProcessed
  
  - name: FeeAdapter
    abi_file_path: ./abis/FeeAdapter.json
    handler: ./src/EventHandlers.ts
    events:
      - event: IntentWithFeesAdded
  
  - name: FeeAdapterV2
    abi_file_path: ./abis/FeeAdapterV2.json
    handler: ./src/EventHandlers.ts
    events:
      - event: IntentWithFeesAdded
      - event: OrderCreated

  - name: EverclearHubV2
    abi_file_path: ./abis/EverclearHubV2.json
    handler: ./src/EventHandlers.ts
    events:
      - event: SettlementEnqueued

# Define all networks
# NOTE: we are using reorg-safe values from hyperlane: https://docs.hyperlane.xyz/docs/reference/addresses/validators/latencies
