        address: 0xa05A3380889115bf313f1Db9d5f335157Be4D816
      - name: FeeAdapter
        address: 0x15a7cA97D1ed168fB34a4055CEFa2E2f9Bdb6C75
      - name: EverclearSpokeV5
        address: 0xa05A3380889115bf313f1Db9d5f335157Be4D816  # Same address as V1 (upgraded contract)
      - name: FeeAdapterV2
