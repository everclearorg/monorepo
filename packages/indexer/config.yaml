name: everclear-indexer-prod
unordered_multichain_mode: true
description: Everclear protocol indexer - full subgraph parity across all mainnet chains

# Configure which fields to include from events
field_selection:
  transaction_fields:
    - 'hash'
    - 'from'
    - 'gasPrice'
    - 'gasLimit'

# Define the contract ABIs
contracts:
  - name: EverclearSpoke
    abi_file_path: ./abis/EverclearSpoke.json
    handler: ./src/EventHandlers.ts
    events:
      - event: IntentAdded
      - event: IntentFilled
      - event: IntentQueueProcessed
      - event: Deposited
      - event: Withdrawn
      - event: Settled
      - event: FillQueueProcessed
      - event: ExternalCalldataExecuted
      - event: AssetTransferFailed
      - event: AssetMintFailed

  - name: EverclearSpokeV5
    abi_file_path: ./abis/EverclearSpokeV5.json
    handler: ./src/EventHandlers.ts
    events:
      - event: IntentAdded
      - event: IntentFilled
      - event: IntentQueueProcessed
      - event: Deposited
      - event: Withdrawn
      - event: Settled
      - event: FillQueueProcessed
      - event: ExternalCalldataExecuted
      - event: AssetTransferFailed
      - event: AssetMintFailed
      - event: Paused
      - event: Unpaused
      - event: GatewayUpdated
      - event: LighthouseUpdated
      - event: MessageReceiverUpdated
      - event: WatchtowerUpdated
      - event: MessageGasLimitUpdated
      - event: FeeAdapterUpdated
      - event: FillSignerUpdated

  - name: FeeAdapter
    abi_file_path: ./abis/FeeAdapter.json
    handler: ./src/EventHandlers.ts
    events:
      - event: IntentWithFeesAdded

  - name: FeeAdapterV2
    abi_file_path: ./abis/FeeAdapterV2.json
    handler: ./src/EventHandlers.ts
    events:
      - event: IntentWithFeesAdded
      - event: OrderCreated

  - name: EverclearHubV2
    abi_file_path: ./abis/EverclearHubV2.json
    handler: ./src/EventHandlers.ts
    events:
      - event: SettlementEnqueued
      - event: IntentProcessed
      - event: FillProcessed
      - event: SettlementQueueProcessed
      - event: InvoiceEnqueued
      - event: DepositEnqueued
      - event: DepositProcessed
      - event: FeesWithdrawn
      - event: ReturnUnsupportedIntent
      - event: TokenConfigsSet
      - event: AssetConfigSet
      - event: MaxDiscountDbpsSet
      - event: PrioritizedStrategySet
      - event: DiscountPerEpochSet
      - event: SolverConfigUpdated
      - event: IncreaseVirtualBalanceSet
      - event: Paused
      - event: Unpaused
      - event: OwnershipTransferred
      - event: OwnershipProposed
      - event: GatewayUpdated
      - event: AcceptanceDelayUpdated
      - event: MinSolverSupportedDomainsUpdated
      - event: EpochLengthUpdated
      - event: ExpiryTimeBufferUpdated
      - event: SupportedDomainsAdded
      - event: SupportedDomainsRemoved
      - event: WatchtowerUpdated
      - event: MailboxUpdated
      - event: SecurityModuleUpdated

